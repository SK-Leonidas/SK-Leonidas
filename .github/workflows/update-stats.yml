name: Update GitHub Stats

on:
  schedule:
    - cron: "0 0 * * *"   # daily at midnight UTC
  workflow_dispatch:        # lets you trigger it manually from the Actions tab

permissions:
  contents: write

jobs:
  update-stats:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout profile repository
        uses: actions/checkout@v4

      - name: Generate GitHub Stats
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=SK-Leonidas&show_icons=true&theme=tokyonight&hide_border=true&include_all_commits=true&count_private=true&bg_color=0d1117&title_color=70a5fd&icon_color=bf91f3&text_color=c9d1d9&border_radius=10
          path: profile/stats.svg
          # NOTE: count_private=true only works if `token` below is a PAT with
          # `repo` + `read:user` scopes. The default GITHUB_TOKEN is scoped to
          # this repo only, so private contributions across your account won't
          # be counted unless you add a PAT (see comment at bottom of file).
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate Top Languages
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=SK-Leonidas&layout=compact&theme=tokyonight&hide_border=true&langs_count=8&bg_color=0d1117&title_color=70a5fd&text_color=c9d1d9&border_radius=10
          path: profile/top-langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit updated stats
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/*.svg
          git commit -m "Update GitHub stats" || exit 0
          git push

# To get accurate private-contribution counts:
# 1. GitHub Settings → Developer settings → Personal access tokens →
#    generate one with `repo` and `read:user` scopes.
# 2. Add it as a repo secret, e.g. named PAT_TOKEN.
# 3. Replace both `token: ${{ secrets.GITHUB_TOKEN }}` lines above with
#    `token: ${{ secrets.PAT_TOKEN }}`.
